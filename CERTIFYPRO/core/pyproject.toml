[tool.poetry]
name = "certifypro"
version = "2.0.0"
description = "Система генерації сертифікатів і документів для контролю якості"
authors = ["CertifyPro Team"]
license = "Proprietary"
readme = "README_v2.md"
homepage = ""
repository = ""

[tool.poetry.dependencies]
python = "^3.9"
customtkinter = "5.2.0"
python-docx = "1.1.0"
docxtpl = "0.16.0"
openpyxl = ">=3.1.5"
pandas = ">=3.0.1"
pyinstaller = ">=6.15.0"
Pillow = ">=11.0.0"

[tool.poetry.group.dev.dependencies]
black = ">=23.0.0"
isort = ">=5.12.0"
flake8 = ">=6.0.0"
flake8-bugbear = ">=23.0.0"
flake8-comprehensions = ">=3.14.0"
flake8-simplify = ">=0.19.0"
mypy = ">=1.0.0"
types-setuptools = "*"
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
pytest-mock = ">=3.10.0"
pre-commit = ">=3.0.0"
ipython = ">=8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Налаштування інструментів
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["."]
remove_redundant_aliases = true
order_by_type = false
group_by_package = true
combine_as_imports = true
combine_star = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "migrations",
    ".venv",
    "venv",
]
max-complexity = 10

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "migrations/",
    "tests/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["services", "models", "database"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
