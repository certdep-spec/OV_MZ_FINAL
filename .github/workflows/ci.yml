name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CERTIFYPRO/core/requirements.txt
          pip install pytest pytest-cov ruff

      - name: Run tests
        run: |
          pytest CERTIFYPRO/core/tests -v --tb=short

      - name: Lint with ruff
        run: |
          ruff check CERTIFYPRO/core --ignore E501 F401

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r CERTIFYPRO/core/requirements.txt
          pip install pyinstaller

      - name: Build CertifyPro.exe
        run: |
          pyinstaller --noconfirm build_certifypro.spec

      - name: Build launcher.exe
        run: |
          pyinstaller --noconfirm build_launcher.spec

      - name: Verify build output
        run: |
          if (-not (Test-Path "dist\CertifyPro\CertifyPro.exe")) {
            Write-Error "CertifyPro.exe not found"
            exit 1
          }
          if (-not (Test-Path "dist\launcher.exe")) {
            Write-Error "launcher.exe not found"
            exit 1
          }
          Write-Host "Build successful!"
